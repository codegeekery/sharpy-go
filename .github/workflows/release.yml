name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: sharpy-linux-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: sharpy-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: sharpy-darwin-arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            artifact: sharpy-darwin-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.goos != 'windows'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # --- Instalar libvips según el sistema operativo del runner ---
      - name: Install libvips (Linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Install libvips (macOS)
        if: matrix.goos == 'darwin'
        run: brew install vips

      - name: Setup MSYS2 with Go and libvips (Windows)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-go

      - name: Build binary (Linux/macOS)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -o dist/${{ matrix.artifact }} .

      - name: Build binary (Windows)
        if: matrix.goos == 'windows'
        shell: msys2 {0}
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -o dist/${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
